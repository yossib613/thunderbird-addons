<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Reminders due</title>
  <link rel="stylesheet" href="dialog.css">
  <link rel="stylesheet" href="due.css">
</head>
<body>
  <main>
    <h1 id="heading">Reminders due</h1>
    <ul class="reminders" id="list"></ul>
  </main>

  <template id="reminder">
    <li class="card reminder">
      <div class="stub" aria-hidden="true">
        <span class="stub-time"></span>
        <span class="stub-date"></span>
      </div>
      <div class="card-body">
        <h2 class="subject"></h2>
        <p class="author"></p>
        <p class="note"></p>
        <p class="due-text sr-only"></p>

        <div class="actions">
          <button type="button" class="btn btn-primary" data-action="open">Open email</button>
          <button type="button" class="btn btn-secondary" data-action="done">Mark as done</button>
        </div>

        <div class="snooze section" role="group">
          <span class="label">Remind me again in</span>
          <div class="chips">
            <button type="button" class="chip" data-minutes="30">30 min</button>
            <button type="button" class="chip" data-minutes="60">1 hour</button>
            <button type="button" class="chip" data-minutes="1440">1 day</button>
            <button type="button" class="chip" data-action="pick" aria-expanded="false">Pick a time…</button>
          </div>
        </div>

        <div class="picker" hidden>
          <label class="picker-label">Remind me at
            <input type="datetime-local" class="picker-input">
          </label>
          <button type="button" class="btn btn-secondary" data-action="snooze-until">Snooze until then</button>
        </div>

        <p class="error" role="alert"></p>
        <p class="confirm" role="status"></p>
      </div>
    </li>
  </template>

  <script src="../common.js"></script>
  <script src="due.js"></script>
</body>
</html>
